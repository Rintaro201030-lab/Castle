<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>大日本国全図 - 高精細葵城絵巻</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', serif;
            background-color: #0a0806;
            color: #e8e3d5;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #title-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            color: #d4af37;
            font-size: 22px;
            letter-spacing: 4px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        .header-info {
            font-size: 13px;
            color: #c5a059;
        }

        #game-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 10px 35px rgba(0,0,0,0.95);
            border: 3px solid #5a4833;
            border-radius: 4px;
            background: #080705;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        #bottom-panel {
            width: 100%;
            display: grid;
            grid-template-columns: 280px 1fr 200px;
            gap: 10px;
        }

        .panel-box {
            background: #181410;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #3d3224;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
        }

        h2 {
            margin: 0 0 6px 0;
            color: #d4af37;
            border-bottom: 1px solid #3d3224;
            padding-bottom: 3px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px 8px;
            font-size: 12px;
        }
        .status-item span { color: #8a7c65; }
        .status-item strong { color: #f0e6d2; }

        .build-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        button.build-btn {
            padding: 5px 6px;
            background: linear-gradient(180deg, #382c1e, #211a13);
            color: #e8e3d5;
            border: 1px solid #52422d;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.15s;
        }
        button.build-btn:hover { background: linear-gradient(180deg, #4d3d29, #33271c); border-color: #b8860b; }
        button.build-btn.selected { background: linear-gradient(180deg, #7c3e11, #4a2408); border-color: #d4af37; color: #fff; box-shadow: 0 0 8px rgba(212,175,55,0.4); }
        button.build-btn:disabled { background: #120f0c; color: #3d352b; border-color: #1f1a14; cursor: not-allowed; }
        .btn-cost { font-size: 9px; color: #ffd700; margin-top: 1px; }

        .turn-btn {
            width: 100%;
            height: 100%;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #7a0000, #4d0000);
            border: 1px solid #8b2525;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .turn-btn:hover { background: linear-gradient(180deg, #990000, #660000); border-color: #d4af37; }

        #log {
            height: 70px;
            overflow-y: auto;
            font-size: 11px;
            background: #090806;
            padding: 5px;
            border-radius: 3px;
            color: #a89f8d;
            line-height: 1.35;
            border: 1px solid #241d16;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div id="title-container">
    <h1>大日本国全図 - 高精細葵城絵巻</h1>
    <div class="header-info">細密マップ (36×20 格子 / 高精細グラフィック)</div>
</div>

<div id="game-layout">
    <div id="canvas-container">
        <!-- 36 * 28 = 1008, 20 * 28 = 560 -->
        <canvas id="canvas" width="1008" height="560"></canvas>
    </div>

    <div id="bottom-panel">
        <div class="panel-box">
            <h2>【領国目録】</h2>
            <div class="status-grid">
                <div class="status-item"><span>年代:</span> <strong id="year-disp" style="color:#d4af37;">1年(春)</strong></div>
                <div class="status-item"><span>当主:</span> <strong id="lord-disp">初代</strong></div>
                <div class="status-item"><span>軍資金:</span> <strong id="gold-disp" style="color:#ffd700;">500貫</strong></div>
                <div class="status-item"><span>兵糧高:</span> <strong id="koku-disp" style="color:#2ecc71;">200石</strong></div>
                <div class="status-item"><span>領民:</span> <strong id="pop-disp">30人</strong></div>
                <div class="status-item"><span>天守耐久:</span> <strong id="hp-disp" style="color:#e74c3c;">100/100</strong></div>
            </div>
            <div id="log"></div>
        </div>

        <div class="panel-box">
            <h2>【城郭・領地開発普請】</h2>
            <div class="build-grid">
                <button class="build-btn" id="btn-wall" onclick="selectBuild('wall')">
                    <span>高石垣</span><span class="btn-cost">20貫</span>
                </button>
                <button class="build-btn" id="btn-moat" onclick="selectBuild('moat')">
                    <span>水堀掘削</span><span class="btn-cost">35貫</span>
                </button>
                <button class="build-btn" id="btn-arrow" onclick="selectBuild('arrow')">
                    <span>弓矢倉</span><span class="btn-cost">50貫</span>
                </button>
                <button class="build-btn" id="btn-gun" onclick="selectBuild('gun')" disabled><span>鉄砲櫓</span><span class="btn-cost">150貫 (15年~)</span></button>
                <button class="build-btn" id="btn-cannon" onclick="selectBuild('cannon')" disabled><span>大筒櫓</span><span class="btn-cost">300貫 (31年~)</span></button>
                <button class="build-btn" id="btn-farm" onclick="selectBuild('farm')">
                    <span>新田開発</span><span class="btn-cost">40貫</span>
                </button>
            </div>
        </div>

        <div class="panel-box" style="display:flex; flex-direction:column; justify-content:center;">
            <button class="turn-btn" onclick="nextSeason()">
                時を進める<br><span style="font-size:10px; font-weight:normal; opacity:0.8;">(次の季節へ)</span>
            </button>
        </div>
    </div>
</div>

<script>
const COLS = 36;
const ROWS = 20;
const TILE_SIZE = 28;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let mousePos = { x: -1, y: -1 };

// 地形生成 (0:平地, 1:山地, 2:水域)
const MAP_TERRAIN = [];
for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) {
        if (y === 0 || y === ROWS - 1 || x === 0 || x === COLS - 1) {
            row.push(2); // 外郭水域
        } else if ((x < 5 && y < 6) || (x > 30 && y > 14) || (x > 18 && x < 24 && y < 5)) {
            row.push(1); // 山地エリア
        } else if ((x > 10 && x < 15 && y > 12) || (x > 25 && x < 29 && y < 10)) {
            row.push(2); // 内陸湖・河川
        } else {
            row.push(0); // 平地
        }
    }
    MAP_TERRAIN.push(row);
}

let state = {
    year: 1,
    seasonIndex: 0,
    seasons: ['春', '夏', '秋', '冬'],
    gold: 500,
    koku: 200,
    pop: 30,
    castleHp: 100,
    maxCastleHp: 100,
    lordGeneration: 1,
    selectedBuilding: null,
    grid: Array(ROWS).fill(null).map(() => Array(COLS).fill(null)),
    enemies: [],
    effects: []
};

const BUILDINGS = {
    keep:   { name: '天守閣', hp: 100 },
    wall:   { name: '高石垣', cost: 20, hp: 200 },
    moat:   { name: '水堀', cost: 35, hp: 999 },
    arrow:  { name: '弓矢倉', cost: 50, hp: 60, range: 4.5, atk: 18 },
    gun:    { name: '鉄砲櫓', cost: 150, hp: 90, range: 6.5, atk: 52 },
    cannon: { name: '大筒櫓', cost: 300, hp: 120, range: 9.0, atk: 95, isAoe: true },
    farm:   { name: '新田', cost: 40, hp: 25 }
};

// 本丸を中央に配置
const KEEP_POS = { x: 18, y: 10 };
state.grid[KEEP_POS.y][KEEP_POS.x] = { type: 'keep', hp: BUILDINGS.keep.hp };

function log(msg) {
    const logDiv = document.getElementById('log');
    logDiv.innerHTML = `<div>・${msg}</div>` + logDiv.innerHTML;
}

function selectBuild(type) {
    state.selectedBuilding = type;
    document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('selected'));
    if (type) document.getElementById(`btn-${type}`).classList.add('selected');
}

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
    mousePos.y = Math.floor((e.clientY - rect.top) / TILE_SIZE);
    draw();
});

canvas.addEventListener('mouseleave', () => {
    mousePos = { x: -1, y: -1 };
    draw();
});

canvas.addEventListener('click', (e) => {
    if (!state.selectedBuilding) return;

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
    const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);

    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    if (MAP_TERRAIN[y][x] === 1) { log('山地には建設できません。'); return; }
    if (MAP_TERRAIN[y][x] === 2) { log('水域には建設できません。'); return; }
    if (state.grid[y][x] !== null) { log('指定マスには既に構造物があります。'); return; }

    const bInfo = BUILDINGS[state.selectedBuilding];
    if (state.gold < bInfo.cost) { log('軍資金が不足しています。'); return; }

    state.gold -= bInfo.cost;
    state.grid[y][x] = { type: state.selectedBuilding, hp: bInfo.hp };
    log(`(${x}, ${y}) に【${bInfo.name}】を建築。`);
    
    updateUI();
    draw();
});

function nextSeason() {
    state.seasonIndex++;
    if (state.seasonIndex >= 4) {
        state.seasonIndex = 0;
        state.year++;
        processYearlyEvents();
    }

    log(`--- ${state.year}年目 【${state.seasons[state.seasonIndex]}】 ---`);

    processEconomy();
    processCombat();

    updateUI();
    draw();

    if (state.castleHp <= 0) {
        alert(`【落城】 ${state.year}年目、城郭は包囲され葵の家紋は破れました...`);
        location.reload();
    }
    if (state.year > 50) {
        alert(`【天下不落】 50年の乱世を耐え抜き、名城の矜持を遺しました！`);
        location.reload();
    }
}

function processYearlyEvents() {
    if (state.year === 15) {
        document.getElementById('btn-gun').disabled = false;
        log('【兵器革新】 鉄砲術を獲得。「鉄砲櫓」が解放。');
    }
    if (state.year === 31) {
        document.getElementById('btn-cannon').disabled = false;
        log('【重砲導入】 大筒の技術を獲得。「大筒櫓」が解放。');
    }
    if (state.year === 20) {
        state.lordGeneration = 2;
        log('【当主継承】 二代目当主へ。内政収入増加。');
    } else if (state.year === 40) {
        state.lordGeneration = 3;
        log('【当主継承】 三代目当主へ。天守一部修繕。');
        state.castleHp = Math.min(state.maxCastleHp, state.castleHp + 40);
    }
}

function processEconomy() {
    let farmCount = 0;
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (state.grid[y][x]?.type === 'farm') farmCount++;
        }
    }

    const goldIncome = 50 + (state.pop * 2) + (state.lordGeneration === 2 ? 60 : 0);
    state.gold += goldIncome;

    if (state.seasonIndex === 2) {
        const kokuIncome = farmCount * 70;
        state.koku += kokuIncome;
        state.pop += Math.floor(farmCount * 2.5);
        log(`【秋の収穫】 兵糧 +${kokuIncome}石。領民が ${state.pop}人 に増加。`);
    }
}

function processCombat() {
    if (state.seasonIndex === 2 || state.seasonIndex === 3) spawnEnemies();
    if (state.enemies.length === 0) return;

    log(`敵勢力が侵攻中！ (規模: ${state.enemies.length}隊)`);

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const cell = state.grid[y][x];
            if (!cell) continue;
            const bInfo = BUILDINGS[cell.type];

            if (bInfo && bInfo.atk) {
                let targets = state.enemies.filter(e => Math.hypot(e.x - x, e.y - y) <= bInfo.range);
                if (targets.length > 0) {
                    if (bInfo.isAoe) {
                        const target = targets[0];
                        state.enemies.forEach(e => {
                            if (Math.hypot(e.x - target.x, e.y - target.y) <= 2.5) {
                                e.hp -= bInfo.atk;
                            }
                        });
                        log(`【${bInfo.name}】大筒着弾！`);
                        state.effects.push({ sx: x, sy: y, tx: target.x, ty: target.y, type: cell.type });
                    } else {
                        targets[0].hp -= bInfo.atk;
                        state.effects.push({ sx: x, sy: y, tx: targets[0].x, ty: targets[0].y, type: cell.type });
                    }
                }
            }
        }
    }

    state.enemies.forEach(e => {
        if (e.hp <= 0) return;
        
        let speed = 0.5;
        const cx = Math.floor(e.x);
        const cy = Math.floor(e.y);
        
        if (MAP_TERRAIN[cy] && MAP_TERRAIN[cy][cx] === 2) speed = 0.2; 
        if (state.grid[cy] && state.grid[cy][cx]?.type === 'moat') speed = 0.1; 

        if (e.isCannonUnit) {
            const dist = Math.hypot(e.x - KEEP_POS.x, e.y - KEEP_POS.y);
            if (dist <= 7.0) {
                state.castleHp -= e.atk;
                log(`【敵・砲兵】遠射！ 天守耐久 -${e.atk}`);
                state.effects.push({ sx: e.x, sy: e.y, tx: KEEP_POS.x, ty: KEEP_POS.y, type: 'enemy_cannon' });
                return;
            }
        }

        if (e.x < KEEP_POS.x) e.x += speed;
        if (e.x > KEEP_POS.x) e.x -= speed;
        if (e.y < KEEP_POS.y) e.y -= speed;
        if (e.y > KEEP_POS.y) e.y += speed;

        if (Math.abs(e.x - KEEP_POS.x) < 0.8 && Math.abs(e.y - KEEP_POS.y) < 0.8) {
            state.castleHp -= e.atk;
            log(`敵が本丸突入！ 天守耐久 -${e.atk}`);
        }
    });

    state.enemies = state.enemies.filter(e => e.hp > 0);
}

function spawnEnemies() {
    const count = 5 + Math.floor(state.year / 3);
    const enemyHp = 45 + (state.year * 7);
    
    for (let i = 0; i < count; i++) {
        let ex, ey;
        do {
            const side = Math.floor(Math.random() * 4);
            if (side === 0) { ex = Math.floor(Math.random() * COLS); ey = 0; }
            else if (side === 1) { ex = COLS - 1; ey = Math.floor(Math.random() * ROWS); }
            else if (side === 2) { ex = Math.floor(Math.random() * COLS); ey = ROWS - 1; }
            else { ex = 0; ey = Math.floor(Math.random() * ROWS); }
        } while (MAP_TERRAIN[ey][ex] === 1);

        const isCannon = (state.year >= 30 && Math.random() < 0.35);
        state.enemies.push({
            x: ex,
            y: ey,
            hp: isCannon ? enemyHp * 1.4 : enemyHp,
            maxHp: isCannon ? enemyHp * 1.4 : enemyHp,
            atk: isCannon ? 26 : 12,
            isCannonUnit: isCannon
        });
    }
}

function updateUI() {
    const lordTitles = ['', '初代', '二代目', '三代目'];
    document.getElementById('year-disp').innerText = `${state.year}年(${state.seasons[state.seasonIndex]})`;
    document.getElementById('lord-disp').innerText = lordTitles[state.lordGeneration];
    document.getElementById('gold-disp').innerText = `${state.gold}貫`;
    document.getElementById('koku-disp').innerText = `${state.koku}石`;
    document.getElementById('pop-disp').innerText = `${state.pop}人`;
    document.getElementById('hp-disp').innerText = `${Math.max(0, state.castleHp)}/${state.maxCastleHp}`;
}

// 高精細グラフィック描画関数
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const seasonGrass = [
        ['#344e21', '#2d441c'], // 春
        ['#284218', '#213813'], // 夏
        ['#52401b', '#453516'], // 秋
        ['#383e36', '#2d332b']  // 冬
    ];
    const gCol = seasonGrass[state.seasonIndex];

    // 1. 地形高精細描画
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const terrain = MAP_TERRAIN[y][x];
            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            if (terrain === 0) { // 平地
                const grad = ctx.createLinearGradient(px, py, px+TILE_SIZE, py+TILE_SIZE);
                grad.addColorStop(0, gCol[0]);
                grad.addColorStop(1, gCol[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            } else if (terrain === 1) { // 山地
                ctx.fillStyle = '#221b15';
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                ctx.fillStyle = '#3a3025';
                ctx.beginPath();
                ctx.moveTo(px + 14, py + 3);
                ctx.lineTo(px + 25, py + 25);
                ctx.lineTo(px + 3, py + 25);
                ctx.fill();
                ctx.fillStyle = '#17130f';
                ctx.beginPath();
                ctx.moveTo(px + 14, py + 3);
                ctx.lineTo(px + 25, py + 25);
                ctx.lineTo(px + 14, py + 25);
                ctx.fill();
            } else if (terrain === 2) { // 水域
                const waterGrad = ctx.createLinearGradient(px, py, px, py+TILE_SIZE);
                waterGrad.addColorStop(0, '#0f3854');
                waterGrad.addColorStop(1, '#092336');
                ctx.fillStyle = waterGrad;
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                
                // 波紋パーツ
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                if ((x + y) % 3 === 0) ctx.fillRect(px + 4, py + 8, 8, 1);
                if ((x * y) % 5 === 0) ctx.fillRect(px + 14, py + 18, 10, 1);
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
        }
    }

    // ハイライト表示
    if (mousePos.x >= 0 && mousePos.x < COLS && mousePos.y >= 0 && mousePos.y < ROWS) {
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(mousePos.x * TILE_SIZE + 1, mousePos.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
    }

    // 2. 構造物高精細描画
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const cell = state.grid[y][x];
            if (!cell) continue;

            const px = x * TILE_SIZE;
            const py = y * TILE_SIZE;

            if (cell.type === 'keep') { // 和風天守閣
                // 石垣台座
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(px + 2, py + 18, 24, 8);
                // 階層・漆喰壁
                ctx.fillStyle = '#e8e8e8';
                ctx.fillRect(px + 5, py + 8, 18, 11);
                // 屋根（黒瓦）
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(px + 3, py + 7, 22, 3);
                ctx.fillRect(px + 7, py + 2, 14, 3);
                // 窓
                ctx.fillStyle = '#000';
                ctx.fillRect(px + 8, py + 11, 3, 4);
                ctx.fillRect(px + 17, py + 11, 3, 4);
                // 金鯱
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(px + 5, py + 1, 2, 2);
                ctx.fillRect(px + 21, py + 1, 2, 2);
            } else if (cell.type === 'moat') { // 水堀
                ctx.fillStyle = '#0891b2';
                ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                ctx.fillStyle = '#a5f3fc';
                ctx.fillRect(px + 4, py + 6, 10, 2);
                ctx.fillRect(px + 12, py + 18, 12, 2);
            } else if (cell.type === 'wall') { // 高石垣
                ctx.fillStyle = '#525252';
                ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                ctx.strokeStyle = '#262626';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(px + 1, py + 10); ctx.lineTo(px + TILE_SIZE - 1, py + 10);
                ctx.moveTo(px + 1, py + 19); ctx.lineTo(px + TILE_SIZE - 1, py + 19);
                ctx.moveTo(px + 10, py + 1); ctx.lineTo(px + 10, py + 10);
                ctx.moveTo(px + 18, py + 10); ctx.lineTo(px + 18, py + 19);
                ctx.stroke();
            } else if (cell.type === 'arrow') { // 弓矢倉
                ctx.fillStyle = '#78350f';
                ctx.fillRect(px + 3, py + 12, 22, 13);
                ctx.fillStyle = '#f3f4f6';
                ctx.fillRect(px + 5, py + 6, 18, 8);
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(px + 3, py + 5, 22, 2);
            } else if (cell.type === 'gun') { // 鉄砲櫓
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(px + 3, py + 3, 22, 22);
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(px + 6, py + 6, 16, 10);
                ctx.fillStyle = '#000';
                ctx.fillRect(px + 8, py + 12, 12, 3);
            } else if (cell.type === 'cannon') { // 大筒櫓
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(px + 2, py + 2, 24, 24);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(px + 4, py + 10, 20, 8);
                ctx.fillStyle = '#000';
                ctx.fillRect(px + 18, py + 12, 5, 4);
            } else if (cell.type === 'farm') { // 新田
                ctx.fillStyle = '#15803d';
                ctx.fillRect(px + 2, py + 2, 24, 24);
                ctx.fillStyle = '#a3e635';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(px + 5 + i*7, py + 5, 2, 18);
                }
            }
        }
    }

    // 3. 敵ユニット高精細描画
    state.enemies.forEach(e => {
        const px = e.x * TILE_SIZE + TILE_SIZE/2;
        const py = e.y * TILE_SIZE + TILE_SIZE/2;

        ctx.fillStyle = e.isCannonUnit ? '#9333ea' : '#dc2626';
        ctx.beginPath();
        ctx.arc(px, py, e.isCannonUnit ? 8 : 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();

        // HPバー
        const hpRate = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#000';
        ctx.fillRect(px - 10, py - 12, 20, 3);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(px - 9, py - 11, 18 * hpRate, 1);
    });

    // 4. 攻撃エフェクト描画
    state.effects.forEach(ef => {
        ctx.strokeStyle = (ef.type === 'cannon' || ef.type === 'enemy_cannon') ? '#f87171' : '#fef08a';
        ctx.lineWidth = (ef.type === 'cannon' || ef.type === 'enemy_cannon') ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(ef.sx * TILE_SIZE + TILE_SIZE/2, ef.sy * TILE_SIZE + TILE_SIZE/2);
        ctx.lineTo(ef.tx * TILE_SIZE + TILE_SIZE/2, ef.ty * TILE_SIZE + TILE_SIZE/2);
        ctx.stroke();
    });
    state.effects = [];
}

updateUI();
draw();
log('高精細・細密マップへ拡張完了。広大なる領域を指揮せよ。');
</script>
