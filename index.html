<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格築城防衛シミュレーション - 2.5D城郭設計</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #182232;
            --panel-border: #2e3d52;
            --text-color: #f1f5f9;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            user-select: none;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 2px;
            color: #e2e8f0;
        }

        #status {
            font-size: 0.8rem;
            color: var(--accent-blue);
            margin-top: 2px;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        canvas {
            background-color: #020617;
            display: block;
            cursor: crosshair;
        }

        .ui-main {
            width: 960px;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-group {
            display: flex;
            gap: 15px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .build-toolbar {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-start;
        }

        .tool-category {
            font-size: 0.75rem;
            color: #94a3b8;
            width: 100%;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .btn:hover {
            background: #334155;
            color: white;
        }

        .btn.active {
            background: var(--accent-blue);
            border-color: #7dd3fc;
            color: #0f172a;
        }

        .btn-cost {
            font-size: 0.65rem;
            opacity: 0.8;
        }

        .btn-action {
            background: var(--accent-red);
            border-color: #f87171;
            color: white;
            padding: 10px 16px;
            font-size: 0.9rem;
            margin-left: auto;
        }
        .btn-action:hover { background: #dc2626; }

        #log-panel {
            background: rgba(24, 34, 50, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #cbd5e1;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>本格築城防衛シミュレーション</h1>
        <div id="status">標高データの読み込みと城郭フィールドの構築中...</div>
    </header>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div class="ui-main">
        <div class="dashboard">
            <div class="stats-group">
                <div class="stat-card">
                    <span class="stat-label">本丸耐久度</span>
                    <span id="hp" class="stat-value" style="color:var(--accent-green)">100%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">木材・石材</span>
                    <span id="resources" class="stat-value">1200</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">防衛波 (Wave)</span>
                    <span id="wave" class="stat-value">1</span>
                </div>
            </div>

            <button class="btn btn-action" onclick="startNextWave()">敵軍開戦 (Wave開始)</button>
        </div>

        <div class="build-toolbar">
            <div class="tool-category">【地形改変・整地】</div>
            <button id="btn-raise" class="btn" onclick="setMode('raise')">盛土 (高台化)<span class="btn-cost">30</span></button>
            <button id="btn-dig" class="btn" onclick="setMode('dig')">掘削 (堀・切岸)<span class="btn-cost">30</span></button>

            <div class="tool-category" style="margin-top:4px;">【防壁・構造物】</div>
            <button id="btn-moat" class="btn" onclick="setMode('moat')">水堀<span class="btn-cost">40</span></button>
            <button id="btn-wall_stone" class="btn" onclick="setMode('wall_stone')">高石垣<span class="btn-cost">80</span></button>
            <button id="btn-gate" class="btn" onclick="setMode('gate')">枡形大手門<span class="btn-cost">150</span></button>

            <div class="tool-category" style="margin-top:4px;">【櫓・天守防衛施設】</div>
            <button id="btn-turret_bow" class="btn" onclick="setMode('turret_bow')">矢倉 (弓)<span class="btn-cost">120</span></button>
            <button id="btn-turret_gun" class="btn" onclick="setMode('turret_gun')">鉄砲櫓<span class="btn-cost">200</span></button>
            <button id="btn-turret_cannon" class="btn" onclick="setMode('turret_cannon')">大砲櫓<span class="btn-cost">350</span></button>
            <button id="btn-keep" class="btn" onclick="setMode('keep')">大天守 (全軍バフ)<span class="btn-cost">600</span></button>
            
            <div class="tool-category" style="margin-top:4px;">【撤去】</div>
            <button id="btn-remove" class="btn" onclick="setMode('remove')" style="color:#ef4444;">解体・撤去<span class="btn-cost">返還50%</span></button>
        </div>

        <div id="log-panel">
            <strong>【築城の極意】</strong> 高石垣の上に「鉄砲櫓」を配置すると標高ボーナスで射程・攻撃力が増加します。「掘削」や「水堀」で敵の進路を限定しましょう。
        </div>
    </div>

<script>
const MAP_CONFIG = {
    zoom: 5,
    minTileX: 28, maxTileX: 29,
    minTileY: 12, maxTileY: 14,
    tileSize: 256
};

// ゲーム全体の詳細ステート
const gameState = {
    resources: 1200,
    baseHp: 500,
    maxBaseHp: 500,
    wave: 1,
    inWave: false,
    selectedMode: 'wall_stone',

    basePos: { x: 260, y: 310 }, // 本丸の位置
    spawns: [
        { x: 210, y: 260 }, // 北西街道
        { x: 310, y: 260 }, // 北東街道
        { x: 260, y: 360 }  // 南方街道
    ],

    gridData: {},  // 築城データマップ (key: x_y)
    enemies: [],
    projectiles: [],
    cursorGrid: { x: 260, y: 310 },
    
    mapData: null,
    width: 0, height: 0,
    step: 4
};

// 建築物の性能テーブル
const BUILD_SPECS = {
    raise:         { name: '盛土', cost: 30 },
    dig:           { name: '掘削', cost: 30 },
    moat:          { name: '水堀', cost: 40, hp: 100, passSpeed: 0.2 },
    wall_stone:    { name: '高石垣', cost: 80, hp: 400, heightAdd: 80 },
    gate:          { name: '枡形大手門', cost: 150, hp: 800, heightAdd: 20 },
    turret_bow:    { name: '矢倉', cost: 120, hp: 150, range: 60, dmg: 15, cd: 25, type: 'bow' },
    turret_gun:    { name: '鉄砲櫓', cost: 200, hp: 200, range: 85, dmg: 35, cd: 40, type: 'gun' },
    turret_cannon: { name: '大砲櫓', cost: 350, hp: 250, range: 120, dmg: 90, cd: 80, type: 'cannon' },
    keep:          { name: '大天守', cost: 600, hp: 1000, buff: true }
};

class CastleEngine {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.tileW = 8;
        this.tileH = 4;
        this.heightScale = 0.02;
    }

    // 2.5D アイソメトリック変換（カメラ本丸固定）
    toIso(x, y, z) {
        const baseIsoX = (this.canvas.width / 2) + (gameState.basePos.x - gameState.basePos.y) * (this.tileW / 2);
        const baseIsoY = (this.canvas.height / 2) + (gameState.basePos.x + gameState.basePos.y) * (this.tileH / 2);

        const offsetX = (this.canvas.width / 2) - baseIsoX;
        const offsetY = (this.canvas.height / 2) - baseIsoY + 60;

        const isoX = (this.canvas.width / 2) + (x - y) * (this.tileW / 2) + offsetX;
        const isoY = (this.canvas.height / 2) + (x + y) * (this.tileH / 2) - (z * this.heightScale) + offsetY;
        return { x: isoX, y: isoY };
    }

    render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (!gameState.mapData) return;

        const w = gameState.width;
        const h = gameState.height;
        const step = gameState.step;

        // 地形＆防衛施設レンダリング
        for (let y = 0; y < h - step; y += step) {
            for (let x = 0; x < w - step; x += step) {
                const key = `${x}_${y}`;
                const b = gameState.gridData[key];

                let z1 = Math.max(0, gameState.mapData[y][x]);
                if (b && b.heightOffset) z1 += b.heightOffset; // 盛土・掘削の反映

                const p1 = this.toIso(x, y, z1);

                // 画面外カット
                if (p1.x < -50 || p1.x > this.canvas.width + 50 || p1.y < -50 || p1.y > this.canvas.height + 50) {
                    continue;
                }

                const p2 = this.toIso(x + step, y, z1);
                const p3 = this.toIso(x + step, y + step, z1);
                const p4 = this.toIso(x, y + step, z1);

                // 地形描画
                this.ctx.fillStyle = b && b.type === 'moat' ? "#0284c7" : this.getTerrainColor(z1);
                this.ctx.strokeStyle = "rgba(0,0,0,0.05)";

                this.ctx.beginPath();
                this.ctx.moveTo(p1.x, p1.y);
                this.ctx.lineTo(p2.x, p2.y);
                this.ctx.lineTo(p3.x, p3.y);
                this.ctx.lineTo(p4.x, p4.y);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.stroke();

                // 本丸
                if (Math.abs(gameState.basePos.x - x) < step && Math.abs(gameState.basePos.y - y) < step) {
                    this.drawBase(p1.x, p1.y);
                }

                // 築城構造物（石垣・櫓・門など）
                if (b && b.structure) {
                    this.drawStructure(b.structure, p1.x, p1.y);
                }

                // 建築カーソル
                if (Math.abs(gameState.cursorGrid.x - x) < step && Math.abs(gameState.cursorGrid.y - y) < step) {
                    this.drawCursor(p1.x, p1.y);
                }

                // 敵の描画
                gameState.enemies.forEach(e => {
                    if (Math.abs(Math.floor(e.x) - x) < step && Math.abs(Math.floor(e.y) - y) < step) {
                        this.drawEnemy(e, p1.x, p1.y);
                    }
                });
            }
        }

        // 弾丸・攻撃エフェクト
        this.drawProjectiles();
    }

    getTerrainColor(elevation) {
        if (elevation <= 0) return "#0369a1";   // 水域
        if (elevation < 100) return "#15803d";  // 平地
        if (elevation < 300) return "#ca8a04";  // 丘陵
        if (elevation < 800) return "#854d0e";  // 高地
        return "#f1f5f9";
    }

    drawBase(x, y) {
        this.ctx.save();
        // 本丸御殿
        this.ctx.fillStyle = "#f8fafc";
        this.ctx.fillRect(x - 14, y - 28, 28, 22);
        this.ctx.strokeStyle = "#0f172a";
        this.ctx.strokeRect(x - 14, y - 28, 28, 22);

        // 多重天守屋根
        this.ctx.fillStyle = "#1e293b";
        this.ctx.beginPath();
        this.ctx.moveTo(x - 18, y - 28);
        this.ctx.lineTo(x, y - 42);
        this.ctx.lineTo(x + 18, y - 28);
        this.ctx.fill();

        this.ctx.fillStyle = "#22c55e";
        this.ctx.font = "bold 11px sans-serif";
        this.ctx.textAlign = "center";
        this.ctx.fillText("本丸御殿", x, y - 46);
        this.ctx.restore();
    }

    drawStructure(struct, x, y) {
        this.ctx.save();
        if (struct.type === 'wall_stone') {
            this.ctx.fillStyle = "#64748b";
            this.ctx.fillRect(x - 8, y - 14, 16, 14);
            this.ctx.strokeStyle = "#334155";
            this.ctx.strokeRect(x - 8, y - 14, 16, 14);
        } else if (struct.type === 'gate') {
            this.ctx.fillStyle = "#78350f";
            this.ctx.fillRect(x - 10, y - 16, 20, 16);
            this.ctx.fillStyle = "#0f172a";
            this.ctx.fillRect(x - 4, y - 10, 8, 10); // 門の開口部
        } else if (struct.type.startsWith('turret_')) {
            // 櫓
            const colors = { turret_bow: "#38bdf8", turret_gun: "#f59e0b", turret_cannon: "#ef4444" };
            this.ctx.fillStyle = colors[struct.type];
            this.ctx.fillRect(x - 7, y - 20, 14, 18);
            this.ctx.fillStyle = "#0f172a";
            this.ctx.fillRect(x - 9, y - 24, 18, 5); // 屋根
        } else if (struct.type === 'keep') {
            // 大天守
            this.ctx.fillStyle = "#f8fafc";
            this.ctx.fillRect(x - 12, y - 32, 24, 28);
            this.ctx.fillStyle = "#0284c7";
            this.ctx.beginPath();
            this.ctx.moveTo(x - 15, y - 32);
            this.ctx.lineTo(x, y - 45);
            this.ctx.lineTo(x + 15, y - 32);
            this.ctx.fill();
        }
        this.ctx.restore();
    }

    drawCursor(x, y) {
        this.ctx.save();
        this.ctx.strokeStyle = "#38bdf8";
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(x - 10, y - 6, 20, 12);
        this.ctx.restore();
    }

    drawEnemy(e, x, y) {
        this.ctx.save();
        this.ctx.fillStyle = e.type === 'boss' ? '#b91c1c' : '#ef4444';
        const radius = e.type === 'boss' ? 8 : 5;
        this.ctx.beginPath();
        this.ctx.arc(x, y - 6, radius, 0, Math.PI * 2);
        this.ctx.fill();

        // HPバー
        this.ctx.fillStyle = "rgba(0,0,0,0.6)";
        this.ctx.fillRect(x - 10, y - 18, 20, 3);
        this.ctx.fillStyle = "#22c55e";
        this.ctx.fillRect(x - 10, y - 18, (e.hp / e.maxHp) * 20, 3);
        this.ctx.restore();
    }

    drawProjectiles() {
        this.ctx.save();
        gameState.projectiles.forEach(p => {
            const startIso = this.toIso(p.x, p.y, p.z);
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(startIso.x, startIso.y - 10, p.size, 0, Math.PI * 2);
            this.ctx.fill();
        });
        this.ctx.restore();
    }
}

// 国土地理院マップロード
async function loadJapanHeightMap() {
    const cfg = MAP_CONFIG;
    const tilesX = (cfg.maxTileX - cfg.minTileX + 1);
    const tilesY = (cfg.maxTileY - cfg.minTileY + 1);
    const fullW = tilesX * cfg.tileSize;
    const fullH = tilesY * cfg.tileSize;

    const compCanvas = document.createElement('canvas');
    compCanvas.width = fullW; compCanvas.height = fullH;
    const compCtx = compCanvas.getContext('2d');

    const promises = [];
    for (let ty = cfg.minTileY; ty <= cfg.maxTileY; ty++) {
        for (let tx = cfg.minTileX; tx <= cfg.maxTileX; tx++) {
            promises.push(new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = `https://cyberjapandata.gsi.go.jp/xyz/dem_png/${cfg.zoom}/${tx}/${ty}.png`;
                img.onload = () => {
                    compCtx.drawImage(img, (tx - cfg.minTileX) * cfg.tileSize, (ty - cfg.minTileY) * cfg.tileSize);
                    resolve();
                };
                img.onerror = () => resolve();
            }));
        }
    }
    await Promise.all(promises);

    const pixels = compCtx.getImageData(0, 0, fullW, fullH).data;
    const heightMap = Array.from({ length: fullH }, () => new Float32Array(fullW));

    for (let y = 0; y < fullH; y++) {
        for (let x = 0; x < fullW; x++) {
            const idx = (y * fullW + x) * 4;
            const xVal = (pixels[idx] << 16) + (pixels[idx + 1] << 8) + pixels[idx + 2];
            let ele = 0;
            if (xVal < 8388608) ele = xVal * 0.01;
            else if (xVal > 8388608) ele = (xVal - 16777216) * 0.01;
            heightMap[y][x] = ele;
        }
    }

    gameState.width = fullW;
    gameState.height = fullH;
    return heightMap;
}

// モード切替
function setMode(mode) {
    gameState.selectedMode = mode;
    document.querySelectorAll('.build-toolbar .btn').forEach(b => b.classList.remove('active'));
    const targetBtn = document.getElementById(`btn-${mode}`);
    if (targetBtn) targetBtn.classList.add('active');
}

// 築城・地形改変の実行
function executeBuild() {
    const gx = gameState.cursorGrid.x;
    const gy = gameState.cursorGrid.y;
    const key = `${gx}_${gy}`;
    const mode = gameState.selectedMode;
    const spec = BUILD_SPECS[mode];

    if (!gameState.gridData[key]) {
        gameState.gridData[key] = { heightOffset: 0, type: null, structure: null };
    }
    const cell = gameState.gridData[key];

    if (mode === 'remove') {
        if (cell.structure || cell.type) {
            cell.structure = null;
            cell.type = null;
            gameState.resources += 40;
            updateUI();
            updateLog("【撤去】構造物を解体し、一部の資材を回収しました。");
        }
        return;
    }

    if (gameState.resources < spec.cost) {
        updateLog("【資材不足】築城資材が不足しています。");
        return;
    }

    // 地形改変
    if (mode === 'raise') {
        cell.heightOffset = (cell.heightOffset || 0) + 50;
        gameState.resources -= spec.cost;
        updateLog("【盛土】地形を嵩上げして高台を作りました。");
    } else if (mode === 'dig') {
        cell.heightOffset = (cell.heightOffset || 0) - 50;
        gameState.resources -= spec.cost;
        updateLog("【掘削】地表を削り、切岸（堀）を作成しました。");
    } else if (mode === 'moat') {
        cell.type = 'moat';
        gameState.resources -= spec.cost;
        updateLog("【水堀】水堀を配置し、敵の進軍速度を低下させます。");
    } else {
        // 構造物配置
        if (cell.structure) {
            updateLog("【配置不可】すでに他の構造物が存在します。");
            return;
        }
        cell.structure = {
            type: mode,
            hp: spec.hp,
            maxHp: spec.hp,
            cooldown: 0
        };
        gameState.resources -= spec.cost;
        updateLog(`【築城】${spec.name} を完成させました。`);
    }

    updateUI();
}

// 防衛波開始
function startNextWave() {
    if (gameState.inWave) return;
    gameState.inWave = true;
    updateLog(`【開戦】Wave ${gameState.wave} 敵軍総攻撃が開始されました！`);

    const count = 8 + gameState.wave * 4;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const spawn = gameState.spawns[i % gameState.spawns.length];
            const isBoss = (i === count - 1 && gameState.wave % 3 === 0);
            gameState.enemies.push({
                x: spawn.x,
                y: spawn.y,
                hp: isBoss ? 400 + gameState.wave * 100 : 80 + gameState.wave * 20,
                maxHp: isBoss ? 400 + gameState.wave * 100 : 80 + gameState.wave * 20,
                speed: isBoss ? 0.15 : 0.25 + Math.random() * 0.1,
                type: isBoss ? 'boss' : 'normal'
            });
        }, i * 800);
    }
}

// ゲームメイン計算ループ
function gameUpdate(engine) {
    if (gameState.inWave) {
        // 敵の移動処理
        gameState.enemies.forEach((e, idx) => {
            const gx = Math.floor(e.x / gameState.step) * gameState.step;
            const gy = Math.floor(e.y / gameState.step) * gameState.step;
            const cell = gameState.gridData[`${gx}_${gy}`];

            let speedMult = 1.0;
            if (cell && cell.type === 'moat') speedMult = 0.3; // 堀で低速化

            const dx = gameState.basePos.x - e.x;
            const dy = gameState.basePos.y - e.y;
            const dist = Math.hypot(dx, dy);

            // 門や防壁との衝突判定
            if (cell && cell.structure && (cell.structure.type === 'gate' || cell.structure.type === 'wall_stone')) {
                cell.structure.hp -= 0.5; // 破城攻撃
                if (cell.structure.hp <= 0) {
                    cell.structure = null;
                    updateLog("【警告】防壁／城門が破壊されました！");
                }
            } else if (dist < 3) {
                // 本丸到達
                gameState.baseHp -= e.type === 'boss' ? 100 : 25;
                gameState.enemies.splice(idx, 1);
                updateUI();
                if (gameState.baseHp <= 0) {
                    alert("【落城】本丸が攻略されました... ゲームオーバー");
                    location.reload();
                }
            } else {
                e.x += (dx / dist) * e.speed * speedMult;
                e.y += (dy / dist) * e.speed * speedMult;
            }
        });

        // 大天守のバフ確認
        let hasKeep = false;
        Object.values(gameState.gridData).forEach(c => {
            if (c.structure && c.structure.type === 'keep') hasKeep = true;
        });

        // 防衛櫓の攻撃計算
        Object.entries(gameState.gridData).forEach(([key, cell]) => {
            const struct = cell.structure;
            if (!struct || !struct.type.startsWith('turret_')) return;

            const spec = BUILD_SPECS[struct.type];
            const [bx, by] = key.split('_').map(Number);
            
            // 標高による射程ボーナス
            const baseEle = gameState.mapData[by][bx] + (cell.heightOffset || 0);
            const eleBonus = Math.floor(baseEle / 50) * 5; 
            const range = spec.range + eleBonus;
            const buffDmg = hasKeep ? 1.3 : 1.0; // 天守バフ

            struct.cooldown = (struct.cooldown || 0) + 1;
            if (struct.cooldown >= spec.cd) {
                const target = gameState.enemies.find(e => Math.hypot(e.x - bx, e.y - by) < range);
                if (target) {
                    struct.cooldown = 0;
                    target.hp -= spec.dmg * buffDmg;

                    gameState.projectiles.push({
                        x: bx, y: by, z: baseEle,
                        color: spec.type === 'bow' ? '#38bdf8' : spec.type === 'gun' ? '#f59e0b' : '#ef4444',
                        size: spec.type === 'cannon' ? 5 : 3,
                        life: 8
                    });

                    if (target.hp <= 0) {
                        const enemyIdx = gameState.enemies.indexOf(target);
                        if (enemyIdx > -1) {
                            gameState.enemies.splice(enemyIdx, 1);
                            gameState.resources += target.type === 'boss' ? 100 : 25;
                            updateUI();
                        }
                    }
                }
            }
        });

        // 弾丸消滅
        gameState.projectiles.forEach((p, i) => {
            p.life--;
            if (p.life <= 0) gameState.projectiles.splice(i, 1);
        });

        // 波クリア判定
        if (gameState.enemies.length === 0 && gameState.inWave) {
            gameState.inWave = false;
            gameState.resources += 200 + gameState.wave * 80;
            gameState.wave++;
            updateUI();
            updateLog(`【大勝利】Waveクリア！ 資材(+${200 + (gameState.wave - 1) * 80}) を獲得。防衛ラインを再構築してください。`);
        }
    }

    engine.render();
    requestAnimationFrame(() => gameUpdate(engine));
}

function updateUI() {
    const hpPercent = Math.max(0, Math.floor((gameState.baseHp / gameState.maxBaseHp) * 100));
    document.getElementById('hp').innerText = `${hpPercent}%`;
    document.getElementById('resources').innerText = gameState.resources;
    document.getElementById('wave').innerText = gameState.wave;
}

function updateLog(msg) {
    document.getElementById('log-panel').innerHTML = msg;
}

// 初期化
async function init() {
    const engine = new CastleEngine('gameCanvas');
    try {
        gameState.mapData = await loadJapanHeightMap();
        document.getElementById('status').innerText = "マップ準備完了！自由な築城を開始してください。";

        setMode('wall_stone');
        updateUI();

        // 建築アクション
        engine.canvas.addEventListener('click', () => {
            executeBuild();
        });

        // マウス座標同期
        engine.canvas.addEventListener('mousemove', (e) => {
            const rect = engine.canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const centerX = engine.canvas.width / 2;
            const centerY = engine.canvas.height / 2;

            const dx = (mouseX - centerX) / (engine.tileW / 2);
            const dy = (mouseY - centerY) / (engine.tileH / 2);

            const gridX = Math.floor(gameState.basePos.x + (dy + dx) / 2);
            const gridY = Math.floor(gameState.basePos.y + (dy - dx) / 2);

            if (gridX >= 0 && gridX < gameState.width && gridY >= 0 && gridY < gameState.height) {
                gameState.cursorGrid.x = Math.floor(gridX / gameState.step) * gameState.step;
                gameState.cursorGrid.y = Math.floor(gridY / gameState.step) * gameState.step;
            }
        });

        gameUpdate(engine);

    } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = "データ読み込みに失敗しました。";
    }
}

init();
</script>
